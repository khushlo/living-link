name: CI - LivingLink

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/livinglink_ci
  FHIR_SERVER_URL: http://localhost:8080/fhir
  FHIR_WRITE_ENABLED: "false"
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jb20k
  CLERK_SECRET_KEY: sk_test_ci_placeholder

jobs:
  generate:
    name: Prisma generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate

  migration:
    name: Prisma migrations
    runs-on: ubuntu-latest
    # Configure PRODUCTION_DATABASE_URL in the repository's GitHub Actions secrets.
    # Keep production isolated to this migration job; tests use disposable Postgres below.
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run type-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: livinglink_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d livinglink_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      hapi:
        image: hapiproject/hapi:v7.4.0
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Wait for HAPI FHIR
        run: |
          for attempt in {1..90}; do
            curl --fail --silent http://localhost:8080/fhir/metadata > /dev/null && exit 0
            sleep 2
          done
          exit 1
      - run: npm run test:integration

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [generate, migration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  accessibility:
    name: Accessibility tests
    runs-on: ubuntu-latest
    needs: [build, lint, type-check, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-a11y-results
          path: test-results/
          if-no-files-found: ignore
