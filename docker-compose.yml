version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: livinglink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: livinglink
      POSTGRES_PASSWORD: livinglink_dev_password
      POSTGRES_DB: livinglink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livinglink"]
      interval: 10s
      timeout: 5s
      retries: 5

  hapi-fhir:
    image: hapiproject/hapi:v7.4.0
    container_name: livinglink-fhir
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.subscription.resthook_enabled: "true"
      hapi.fhir.subscription.websocket_enabled: "true"
      spring.datasource.url: jdbc:postgresql://postgres:5432/livinglink_fhir
      spring.datasource.username: livinglink
      spring.datasource.password: livinglink_dev_password
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgres94Dialect
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/fhir/metadata"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  postgres_data:
